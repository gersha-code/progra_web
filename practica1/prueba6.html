<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado por Edad</title>
</head>

<body>
    <div id="contenedor-resultado" class="resultado"></div>

    <script>
        let contenedor = document.getElementById("contenedor-resultado");
        let nombre = prompt("INGRESE SU NOMBRE:");
        let edad = Number(prompt("INGRESE SU EDAD:"));

        if (edad < 18) {
            alert("Hola " + nombre + ", eres un niño");
            contenedor.innerHTML = '<img src="nino.jpg" alt="Niño">';
        } else if (edad <= 30) {
            alert("Hola " + nombre + ", vas para el antro");
            contenedor.innerHTML = '<img src="antro.jpg" alt="Antro">';
        } else {
            alert("Hola " + nombre + ", ve al gym");
            contenedor.innerHTML = '<img src="gym.jpg" alt="Gym">';
        }
    </script>
</body>

</html>
